# Web Server Configuration
server.port=8080

# PostgreSQL Connection (Externalized for Security)
# These ${} variables will be defined in the 'Environment' tab on Render
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool Settings 
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# File Upload Settings (For Profile Photos)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Email Configuration (Night Owl Recovery)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=andraelapis5@gmail.com
# Pulls your 16-character App Password from Render Environment
spring.mail.password=${MAIL_PASSWORD} 

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true